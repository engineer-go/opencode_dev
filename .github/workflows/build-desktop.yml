name: Build Desktop (macOS & Linux)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to build"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - linux
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS Desktop (arm64)
    if: ${{ !inputs.platform || inputs.platform == 'macos' || inputs.platform == 'all' }}
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
      NODE_OPTIONS: --max-old-space-size=4096
      OPENCODE_CHANNEL: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}

      - name: Setup Bun & dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun

      - name: Setup Bun CLI
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build App
        run: bun --cwd packages/app run build

      - name: Prebuild Desktop
        working-directory: packages/desktop
        run: bun run prebuild

      - name: Build Desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package macOS
        working-directory: packages/desktop
        run: bun run package:mac --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos-arm64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux Desktop (.deb)
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_OPTIONS: --max-old-space-size=4096
      OPENCODE_CHANNEL: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}

      - name: Setup Bun & dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun

      - name: Setup Bun CLI
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build App
        run: bun --cwd packages/app run build

      - name: Prebuild Desktop
        working-directory: packages/desktop
        run: bun run prebuild

      - name: Build Desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package Linux
        working-directory: packages/desktop
        run: bun run package:linux --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-linux-deb
          path: packages/desktop/dist/*.deb
          if-no-files-found: error
